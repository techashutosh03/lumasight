<svg width="1200" height="460" viewBox="0 0 1200 460" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="460" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="50%" stop-color="#0C1322"/>
      <stop offset="100%" stop-color="#080D18"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(600 220) rotate(90) scale(230 480)">
      <stop offset="0%" stop-color="#04B5FE" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#04B5FE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardSurface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#172338" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0D1524" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="cardEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4CC8FF" stop-opacity="0.65"/>
      <stop offset="50%" stop-color="#4181FE" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="accentBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#04B5FE"/>
      <stop offset="100%" stop-color="#4181FE"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="slateGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
    <filter id="shadow3d" x="-10%" y="-10%" width="125%" height="135%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Canvas -->
  <rect width="1200" height="460" rx="24" fill="url(#bgGrad)"/>
  <rect width="1200" height="460" rx="24" fill="url(#glowCyan)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="458.5" rx="23.25" stroke="rgba(255,255,255,0.10)" stroke-width="1.5"/>

  <!-- Subtle 3D perspective floor grid -->
  <g opacity="0.14" stroke="#38BDF8" stroke-width="1">
    <line x1="120" y1="410" x2="1080" y2="410"/>
    <line x1="180" y1="380" x2="1020" y2="380"/>
    <line x1="240" y1="350" x2="960" y2="350"/>
    <line x1="300" y1="350" x2="180" y2="430"/>
    <line x1="450" y1="350" x2="390" y2="430"/>
    <line x1="600" y1="350" x2="600" y2="430"/>
    <line x1="750" y1="350" x2="810" y2="430"/>
    <line x1="900" y1="350" x2="1020" y2="430"/>
  </g>

  <!-- Title Header -->
  <text x="48" y="48" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif" font-size="20" font-weight="700" letter-spacing="-0.3">
    Honest Depth &amp; Transient Vision Pipeline
  </text>
  <text x="48" y="72" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif" font-size="13">
    Strict provenance tracking in lumasight/Depth/ — live 2D RGB never fabricates 3D hardware depth
  </text>

  <!-- 3D Card 1: Input Sources (with 3D extruded bottom lip) -->
  <g filter="url(#shadow3d)">
    <rect x="48" y="122" width="290" height="226" rx="18" fill="#070B12"/>
    <rect x="48" y="114" width="290" height="226" rx="18" fill="url(#cardSurface)" stroke="url(#cardEdge)" stroke-width="1.5"/>
    <rect x="64" y="130" width="96" height="24" rx="12" fill="rgba(4,181,254,0.16)" stroke="#04B5FE" stroke-opacity="0.45"/>
    <text x="112" y="146" text-anchor="middle" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700">1. INPUTS</text>

    <!-- Sub-pill A -->
    <rect x="64" y="170" width="258" height="68" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.10)"/>
    <circle cx="86" cy="196" r="7" fill="url(#accentBlue)"/>
    <text x="102" y="200" fill="#F1F5F9" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13.5" font-weight="600">Live Mac Camera (Opt-In)</text>
    <text x="102" y="220" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5">2D RGB frames in RAM only (zero disk)</text>

    <!-- Sub-pill B -->
    <rect x="64" y="252" width="258" height="68" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.10)"/>
    <circle cx="86" cy="278" r="7" fill="url(#greenGrad)"/>
    <text x="102" y="282" fill="#F1F5F9" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13.5" font-weight="600">Portrait HEIC / DNG File</text>
    <text x="102" y="302" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5">Explicit NSOpenPanel user selection</text>
  </g>

  <!-- Glowing Connector 1 -> 2 -->
  <path d="M342 227 C376 227, 384 227, 420 227" stroke="url(#accentBlue)" stroke-width="2.5" stroke-dasharray="6 5" filter="url(#softGlow)"/>
  <polygon points="424,227 414,221 414,233" fill="#38BDF8"/>

  <!-- 3D Card 2: Center Provenance & Validation Core -->
  <g filter="url(#shadow3d)">
    <rect x="430" y="108" width="320" height="254" rx="20" fill="#060A11"/>
    <rect x="430" y="98" width="320" height="254" rx="20" fill="url(#cardSurface)" stroke="#38BDF8" stroke-opacity="0.55" stroke-width="1.6"/>
    <!-- Top specular highlight -->
    <line x1="454" y1="100" x2="726" y2="100" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" stroke-linecap="round"/>

    <rect x="448" y="116" width="166" height="24" rx="12" fill="rgba(65,129,254,0.22)" stroke="#4181FE" stroke-opacity="0.6"/>
    <text x="531" y="132" text-anchor="middle" fill="#93C5FD" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700">2. VALIDATION &amp; GATES</text>

    <rect x="448" y="156" width="284" height="52" rx="11" fill="rgba(4,181,254,0.08)" stroke="rgba(4,181,254,0.28)"/>
    <text x="464" y="178" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">Vision Face + 2D Liveness Heuristics</text>
    <text x="464" y="196" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Bounding box, landmarks, glare, parallax cues</text>

    <rect x="448" y="218" width="284" height="52" rx="11" fill="rgba(16,185,129,0.08)" stroke="rgba(16,185,129,0.28)"/>
    <text x="464" y="240" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">DepthDataValidator</text>
    <text x="464" y="258" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Checks finite intrinsics, meters / 1/m &amp; pixel validity</text>

    <rect x="448" y="280" width="284" height="52" rx="11" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.12)"/>
    <text x="464" y="302" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">App Sandbox + Memory-Only Scope</text>
    <text x="464" y="320" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">No templates, no network, no LoginWindow access</text>
  </g>

  <!-- Glowing Connectors 2 -> 3 -->
  <path d="M754 176 C790 176, 790 144, 824 144" stroke="url(#greenGrad)" stroke-width="2.2"/>
  <path d="M754 227 L824 227" stroke="url(#amberGrad)" stroke-width="2.2"/>
  <path d="M754 278 C790 278, 790 310, 824 310" stroke="url(#slateGrad)" stroke-width="2.2"/>

  <!-- 3D Stacked Outcome Cards -->
  <!-- Card 3A: hardwareMeasured -->
  <g filter="url(#shadow3d)">
    <rect x="832" y="106" width="320" height="74" rx="15" fill="#060A11"/>
    <rect x="832" y="100" width="320" height="74" rx="15" fill="url(#cardSurface)" stroke="#10B981" stroke-opacity="0.6" stroke-width="1.4"/>
    <circle cx="856" cy="126" r="6" fill="#10B981"/>
    <text x="872" y="130" fill="#6EE7B7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700">hardwareMeasured</text>
    <text x="850" y="154" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5">Calibrated AVDepthData from Portrait HEIC/DNG</text>
  </g>

  <!-- Card 3B: monocularEstimated -->
  <g filter="url(#shadow3d)">
    <rect x="832" y="196" width="320" height="74" rx="15" fill="#060A11"/>
    <rect x="832" y="190" width="320" height="74" rx="15" fill="url(#cardSurface)" stroke="#F59E0B" stroke-opacity="0.55" stroke-width="1.4"/>
    <circle cx="856" cy="216" r="6" fill="#F59E0B"/>
    <text x="872" y="220" fill="#FCD34D" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700">monocularEstimated</text>
    <text x="850" y="244" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5">Off unless local MonocularDepth.mlmodelc bundled</text>
  </g>

  <!-- Card 3C: unavailable -->
  <g filter="url(#shadow3d)">
    <rect x="832" y="286" width="320" height="74" rx="15" fill="#060A11"/>
    <rect x="832" y="280" width="320" height="74" rx="15" fill="url(#cardSurface)" stroke="#64748B" stroke-opacity="0.65" stroke-width="1.4"/>
    <circle cx="856" cy="306" r="6" fill="#94A3B8"/>
    <text x="872" y="310" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700">unavailable</text>
    <text x="850" y="334" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5">Live macOS RGB reports Depth Unavailable honestly</text>
  </g>

  <!-- Bottom Footer Strip -->
  <text x="600" y="426" text-anchor="middle" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">
    Not a macOS Login / Face ID replacement • Strict User Session Only • Zero Persistent Biometrics
  </text>
</svg>
